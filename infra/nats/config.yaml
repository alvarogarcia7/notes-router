# NATS PoC Configuration
# Schema and application settings

# Schema registry configuration
# Supports local file paths (file://) and HTTP/HTTPS URLs
schemas:
  # Local file path example (default)
  registry: "file://./schemas"

  # HTTP/HTTPS example (commented out)
  # registry: "https://schemas.example.com/nats-poc"

  # Schema validation settings
  validate: true

  # Cache schemas locally for performance
  cache_enabled: true
  cache_dir: "./.schema_cache"

# Message broker configuration
broker:
  # NATS server address
  nats_server: "localhost:4222"

  # Message topics
  input_topic: "pipeline.message.input"
  output_topic: "pipeline.message.output"

# Message directory (for file-based PoC)
message_dir: "/tmp/nats-poc-messages"

# Publisher configuration
publisher:
  producer: "com.nats-poc.publisher/1.0"
  message_type: "greeting"
  schema: "com.nats-poc.publisher/greeting/1.0"
  timeout: 10

# Subscriber configuration
subscriber:
  producer: "com.nats-poc.subscriber/1.0"
  response_schema: "com.nats-poc.subscriber/response/1.0"
  poll_interval: 0.5

# Logging configuration
logging:
  level: "INFO"
  format: "[%(levelname)s] %(message)s"
